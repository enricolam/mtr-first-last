<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTR First & Last Train</title>
  <style>
    :root {
      --bg: #f7f8fa; --card: #fff; --border: #e5e7eb; --text: #111827;
      --muted: #6b7280; --accent: #0f766e; --accent-light: #ccfbf1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg); color: var(--text); line-height: 1.5; padding: 16px; min-height: 100vh;
    }
    body.embed { padding: 8px; background: transparent; }
    .container { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.25rem; font-weight: 700; margin-bottom: 4px; }
    .subtitle { font-size: 0.8rem; color: var(--muted); margin-bottom: 16px; }
    .search-row { display: flex; gap: 10px; margin-bottom: 12px; }
    .search-box { position: relative; flex: 1; }
    .search-box label {
      display: block; font-size: 0.7rem; text-transform: uppercase;
      letter-spacing: 0.04em; color: var(--muted); margin-bottom: 4px;
    }
    input[type="text"] {
      width: 100%; padding: 10px 12px; font-size: 0.95rem;
      border: 1px solid var(--border); border-radius: 10px; background: var(--card); outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,118,110,.15); }
    .dropdown {
      position: absolute; top: 100%; left: 0; right: 0; background: var(--card);
      border: 1px solid var(--border); border-radius: 10px; max-height: 220px;
      overflow-y: auto; z-index: 20; display: none; box-shadow: 0 8px 24px rgba(0,0,0,.08);
    }
    .dropdown.show { display: block; }
    .dropdown-item { padding: 9px 12px; cursor: pointer; font-size: .9rem; border-bottom: 1px solid #f3f4f6; }
    .dropdown-item:last-child { border-bottom: none; }
    .dropdown-item:hover { background: var(--accent-light); }
    .dropdown-item .code { font-size: .7rem; color: var(--muted); margin-left: 5px; }
    .btn-row { margin-bottom: 16px; }
    button#go {
      width: 100%; padding: 11px; font-size: 0.95rem; font-weight: 600;
      background: var(--accent); color: #fff; border: none; border-radius: 10px; cursor: pointer;
    }
    button#go:hover { background: #0d9488; }
    button#go:disabled { background: #99f6e4; cursor: not-allowed; }
    .status { font-size: .85rem; color: var(--muted); margin-bottom: 12px; min-height: 1.2em; }
    .results { display: flex; flex-direction: column; gap: 10px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
    .card-header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 8px; }
    .line-name { font-weight: 600; font-size: .95rem; }
    .direction { font-size: .8rem; color: var(--muted); text-align: right; }
    .times { display: flex; gap: 20px; }
    .time-block { flex: 1; }
    .time-label { font-size: .7rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
    .time-value { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
    .error { color: #b91c1c; font-size: .85rem; }
    .footer { margin-top: 20px; font-size: .7rem; color: var(--muted); text-align: center; }
    .loading {
      display: inline-block; width: 14px; height: 14px; border: 2px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .tag { display: inline-block; font-size: .65rem; padding: 1px 6px; border-radius: 4px; margin-left: 6px; vertical-align: middle; }
    .tag.depart { background: #ccfbf1; color: #0f766e; }
    .tag.arrive { background: #e0e7ff; color: #3730a3; }
    body.embed .chrome { display: none !important; }
    body.embed .status { margin-bottom: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="chrome">
      <h1>MTR First & Last Train</h1>

        <div class="search-box">

          <div class="dropdown" id="dropdownSta"></div>
        </div>
        <div class="search-box">
          <label>Target (tar) · optional</label>
          <input type="text" id="searchTar" placeholder="e.g. Admiralty / ADM" autocomplete="off" />
          <div class="dropdown" id="dropdownTar"></div>
        </div>
      </div>
      <div class="btn-row">
        <button id="go" disabled>Show First & Last</button>
      </div>
    </div>
    <div class="status" id="status">Ready · select a station</div>
    <div class="results" id="results"></div>
    <div class="footer chrome">Data from MTR Journey Planner · Unofficial · Platform departure times</div>
  </div>

|DT","KTL|UT"],"16":["KTL|DT","KTL|UT","TWL|DT","TWL|UT"],"6":["KTL|DT","KTL|UT","TWL|DT","TWL|UT"],"5":["KTL|DT","KTL|UT","TWL|DT","TWL|UT"],"84":["KTL|DT","KTL|UT","TML|UT","TML|DT"],"85":["KTL|DT","KTL|UT"],"103":["TML|UT","TML|DT"],"102":["TML|UT","TML|DT"],"101":["TML|UT","TML|DT"],"100":["TML|UT","TML|DT"],"99":["TML|UT","TML|DT"],"98":["TML|UT","TML|DT"],"97":["TML|UT","TML|DT"],"96":["TML|UT","TML|DT"],"90":["TML|UT","TML|DT"],"91":["TML|UT","TML|DT"],"92":["TML|UT","TML|DT"],"93":["TML|UT","TML|DT"],"80":["TML|UT","TML|DT"],"111":["TML|UT","TML|DT"],"53":["TML|UT","TML|DT","TCL|DT","TCL|UT"],"20":["TML|UT","TML|DT","TWL|DT","TWL|UT"],"114":["TML|UT","TML|DT"],"115":["TML|UT","TML|DT"],"116":["TML|UT","TML|DT"],"117":["TML|UT","TML|DT"],"118":["TML|UT","TML|DT"],"119":["TML|UT","TML|DT"],"120":["TML|UT","TML|DT"],"43":["TCL|DT","TCL|UT"],"42":["TCL|DT","TCL|UT"],"21":["TCL|DT","TCL|UT","TWL|DT","TWL|UT"],"41":["TCL|DT","TCL|UT"],"40":["TCL|DT","TCL|UT"],"39":["TCL|DT","TCL|UT"],"52":["TKL|DT","TKL|UT"],"51":["TKL|DT","TKL|UT"],"50":["TKL|DT","TKL|TKS-DT","TKL|TKS-UT","TKL|UT"],"57":["TKL|TKS-DT","TKL|TKS-UT"],"25":["TWL|DT","TWL|UT"],"24":["TWL|DT","TWL|UT"],"23":["TWL|DT","TWL|UT"],"22":["TWL|DT","TWL|UT"],"19":["TWL|DT","TWL|UT"],"18":["TWL|DT","TWL|UT"],"17":["TWL|DT","TWL|UT"],"4":["TWL|DT","TWL|UT"],"3":["TWL|DT","TWL|UT"],"86":["SIL|UT","SIL|DT"],"87":["SIL|UT","SIL|DT"],"88":["SIL|UT","SIL|DT"],"89":["SIL|UT","SIL|DT"]}};
    const LINE_NAMES = {AEL:"Airport Express",DRL:"Disneyland Resort Line",EAL:"East Rail Line",ISL:"Island Line",KTL:"Kwun Tong Line",SIL:"South Island Line",TCL:"Tung Chung Line",TKL:"Tseung Kwan O Line",TML:"Tuen Ma Line",TWL:"Tsuen Wan Line"};
    const stations = DATA.stations, lineDirs = DATA.lineDirs, stationToLines = DATA.stationToLines;
    const searchSta = document.getElementById("searchSta");
    const searchTar = document.getElementById("searchTar");
    const dropdownSta = document.getElementById("dropdownSta");
    const dropdownTar = document.getElementById("dropdownTar");
    const goBtn = document.getElementById("go");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    let selectedStaId = null, selectedTarId = null;

    function findStation(codeOrId) {
      if (!codeOrId) return null;
      const q = String(codeOrId).toLowerCase();
      return Object.entries(stations).find(([id,s]) => s.c.toLowerCase() === q || id === String(codeOrId)) || null;
    }
    function updateGoButton() { goBtn.disabled = !selectedStaId; }

    function renderDropdown(input, dropdown, query, onSelect) {
      const q = query.trim().toLowerCase();
      if (!q) { dropdown.classList.remove("show"); return; }
      const matches = Object.entries(stations).filter(([id,s]) =>
        s.e.toLowerCase().includes(q) || s.z.includes(q) || s.c.toLowerCase().includes(q)
      ).slice(0, 10);
      dropdown.innerHTML = matches.length === 0
        ? `<div class="dropdown-item">No matches</div>`
        : matches.map(([id,s]) => `<div class="dropdown-item" data-id="${id}">${s.e} <span class="code">${s.z} · ${s.c}</span></div>`).join("");
      dropdown.classList.add("show");
      dropdown.onclick = (e) => {
        const item = e.target.closest(".dropdown-item");
        if (!item || !item.dataset.id) return;
        const id = item.dataset.id, s = stations[id];
        input.value = `${s.e} (${s.c})`;
        dropdown.classList.remove("show");
        onSelect(id);
        updateGoButton();
      };
    }

    searchSta.addEventListener("input", () => {
      selectedStaId = null; updateGoButton();
      renderDropdown(searchSta, dropdownSta, searchSta.value, id => { selectedStaId = id; });
    });
    searchSta.addEventListener("focus", () => {
      if (searchSta.value.trim()) renderDropdown(searchSta, dropdownSta, searchSta.value, id => { selectedStaId = id; });
    });
    searchTar.addEventListener("input", () => {
      selectedTarId = null;
      renderDropdown(searchTar, dropdownTar, searchTar.value, id => { selectedTarId = id; });
    });
    searchTar.addEventListener("focus", () => {
      if (searchTar.value.trim()) renderDropdown(searchTar, dropdownTar, searchTar.value, id => { selectedTarId = id; });
    });
    document.addEventListener("click", e => {
      if (!e.target.closest("#searchSta") && !e.target.closest("#dropdownSta")) dropdownSta.classList.remove("show");
      if (!e.target.closest("#searchTar") && !e.target.closest("#dropdownTar")) dropdownTar.classList.remove("show");
    });

    goBtn.addEventListener("click", () => {
      if (!selectedStaId) return;
      const url = new URL(location);
      url.searchParams.set("sta", stations[selectedStaId].c);
      if (selectedTarId) url.searchParams.set("tar", stations[selectedTarId].c);
      else url.searchParams.delete("tar");
      history.replaceState(null, "", url);
      loadFirstLast(selectedStaId, selectedTarId);
    });

    async function fetchRoute(o, d) {
      const res = await fetch(`https://www.mtr.com.hk/share/customer/jp/api/HRRoutes/?o=${o}&d=${d}&lang=E`);
      if (!res.ok) throw new Error("HTTP " + res.status);
      return res.json();
    }

    async function loadFirstLast(stationId, targetId) {
      resultsEl.innerHTML = "";
      statusEl.innerHTML = `<span class="loading"></span> Fetching first & last trains…`;
      let queries = [];
      if (targetId) {
        const tName = stations[targetId]?.e || targetId;
        queries = [
          { line: "", o: stationId, d: targetId, label: `to ${tName}`, kind: "depart" },
          { line: "", o: targetId, d: stationId, label: `from ${tName}`, kind: "arrive" }
        ];
      } else {
        const lineKeys = stationToLines[stationId] || [];
        if (!lineKeys.length) { statusEl.innerHTML = `<span class="error">No line data found.</span>`; return; }
        const seen = new Set(), linesSeen = new Set();
        for (const key of lineKeys) {
          const line = key.split("|")[0];
          if (linesSeen.has(line)) continue;
          linesSeen.add(line);
          const termini = new Map();
          for (const k of Object.keys(lineDirs)) {
            if (!k.startsWith(line + "|")) continue;
            const stops = lineDirs[k];
            if (!stops?.length) continue;
            termini.set(stops[0].i, stops[0].e);
            termini.set(stops[stops.length - 1].i, stops[stops.length - 1].e);
          }
          termini.delete(stationId);
          for (const [tid, tname] of termini) {
            const depKey = `dep|${line}|${tid}`;
            if (!seen.has(depKey)) {
              seen.add(depKey);
              queries.push({ line, o: stationId, d: tid, label: `to ${tname}`, kind: "depart" });
            }
            const arrKey = `arr|${line}|${tid}`;
            if (!seen.has(arrKey)) {
              seen.add(arrKey);
              queries.push({ line, o: tid, d: stationId, label: `from ${tname}`, kind: "arrive" });
            }
          }
        }
      }
      if (!queries.length) { statusEl.textContent = "No directions found."; return; }

      const results = []; let idx = 0; const concurrency = 4;
      async function worker() {
        while (idx < queries.length) {
          const i = idx++, q = queries[i];
          try {
            const data = await fetchRoute(q.o, q.d);
            let line = q.line;
            if (!line && data.firstTrain?.links?.length) line = data.firstTrain.links[0];
            results.push({ ...q, line: line || "", first: data.firstTrain?.time || "—", last: data.lastTrain?.time || "—", ok: true });
          } catch {
            results.push({ ...q, first: "—", last: "—", ok: false });
          }
        }
      }
      await Promise.all(Array.from({ length: concurrency }, () => worker()));

      results.sort((a, b) => {
        const na = LINE_NAMES[a.line] || a.line || "", nb = LINE_NAMES[b.line] || b.line || "";
        if (na !== nb) return na.localeCompare(nb);
        if (a.kind !== b.kind) return a.kind === "depart" ? -1 : 1;
        return a.label.localeCompare(b.label);
      });

      const stationName = stations[stationId]?.e || stationId;
      const targetName = targetId ? (stations[targetId]?.e || targetId) : null;
      statusEl.textContent = targetName ? `${stationName} ↔ ${targetName}` : `${results.length} service(s) for ${stationName}`;
      resultsEl.innerHTML = results.map(r => `
        <div class="card">
          <div class="card-header">
            <span class="line-name">${LINE_NAMES[r.line] || r.line || "MTR"}<span class="tag ${r.kind}">${r.kind === "depart" ? "Depart" : "Arrive"}</span></span>
            <span class="direction">${r.label}</span>
          </div>
          <div class="times">
            <div class="time-block"><div class="time-label">First</div><div class="time-value">${r.first}</div></div>
            <div class="time-block"><div class="time-label">Last</div><div class="time-value">${r.last}</div></div>
          </div>
          ${r.ok ? "" : `<div class="error" style="margin-top:6px">Failed to load</div>`}
        </div>`).join("");
    }

    (function init() {
      const params = new URLSearchParams(location.search);
      const staParam = params.get("sta") || params.get("station");
      const tarParam = params.get("tar") || params.get("target");
      if (staParam) {
        document.body.classList.add("embed");
        const foundSta = findStation(staParam);
        if (!foundSta) { statusEl.innerHTML = `<span class="error">Station not found: ${staParam}</span>`; return; }
        const [staId] = foundSta;
        let tarId = null;
        if (tarParam) {
          const foundTar = findStation(tarParam);
          if (!foundTar) { statusEl.innerHTML = `<span class="error">Target station not found: ${tarParam}</span>`; return; }
          tarId = foundTar[0];
        }
        loadFirstLast(staId, tarId);
      }
    })();
  </script>
